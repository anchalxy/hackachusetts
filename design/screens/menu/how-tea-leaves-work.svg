ght="600" fill="#1E2A3A">Codes last 7 days</text><text font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573"><tspan x="92" y="995">Use a reward’s QR code within a</tspan><tspan x="92" y="1013">week of claiming it.</tspan></text><rect x="92" y="1032" width="290" height="1" fill="#ECE6DA"/><rect x="34" y="1042" width="44" height="44" rx="12" fill="#F3EFE6"/><g transform="translate(41 1049) scale(1.25) rotate(-14 12 12)"><path d="M12 20.6c.2 1.6-.6 2.6-2.2 2.9" fill="none" stroke="#2F7A4E" stroke-width="1.7" stroke-linecap="round"/><path d="M12 1.8C17.6 4.4 20.6 9.4 19.8 14.4 19.1 18.6 15.9 20.9 12 20.9S4.9 18.6 4.2 14.4C3.4 9.4 6.4 4.4 12 1.8Z" fill="#5DAE72" stroke="#2F7A4E" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 1.8C17.6 4.4 20.6 9.4 19.8 14.4 19.1 18.6 15.9 20.9 12 20.9 15.6 18.8 17.4 15 16.9 10.6 16.5 7.3 14.7 4.3 12 1.8Z" fill="#2F7A4E" opacity="0.28"/><path d="M8.2 6.6C9.2 5.2 10.4 4.2 11.4 3.6" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><circle cx="7.4" cy="8.6" r="0.9" fill="#FFFFFF" opacity="0.85"/><circle cx="9.3" cy="13" r="1.05" fill="#1E2A3A"/><circle cx="14.7" cy="13" r="1.05" fill="#1E2A3A"/><path d="M10.8 15.1q1.2 1.1 2.4 0" fill="none" stroke="#1E2A3A" stroke-width="1.1" stroke-linecap="round"/><ellipse cx="7.6" cy="15" rx="1.3" ry="0.8" fill="#F29A8A" opacity="0.9"/><ellipse cx="16.4" cy="15" rx="1.3" ry="0.8" fill="#F29A8A" opacity="0.9"/></g><text x="92" y="1060" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">Never below zero</text><text x="92" y="1079" font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573">Your balance can’t go negative.</text></g>
