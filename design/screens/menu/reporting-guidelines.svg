<text x="22" y="566" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#1E2A3A">Tips for a good report</text>
<g id="Tips"><rect x="20" y="578" width="362" height="260" rx="20" fill="#FFFFFF" stroke="#ECE6DA" stroke-width="1"/><rect x="34" y="588" width="44" height="44" rx="12" fill="#F3EFE6"/><text x="56" y="617" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#2F6F73" text-anchor="middle">1</text><text x="92" y="606" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">Get it all in frame</text><text font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573"><tspan x="92" y="625">Step back so the city can see the</tspan><tspan x="92" y="643">problem and what’s around it.</tspan></text><rect x="92" y="662" width="290" height="1" fill="#ECE6DA"/><rect x="34" y="672" width="44" height="44" rx="12" fill="#F3EFE6"/><text x="56" y="701" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#2F6F73" text-anchor="middle">2</text><text x="92" y="690" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">Snap it where it is</text><text font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573"><tspan x="92" y="709">Photos are taken live, so the location</tspan><tspan x="92" y="727">comes from where you’re standing.</tspan></text><rect x="92" y="746" width="290" height="1" fill="#ECE6DA"/><rect x="34" y="756" width="44" height="44" rx="12" fill="#F3EFE6"/><text x="56" y="785" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#2F6F73" text-anchor="middle">3</text><text x="92" y="774" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">Say what’s wrong</text><text font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573"><tspan x="92" y="793">A few words is enough, like</tspan><tspan x="92" y="811">“pothole near the bus stop”.</tspan></text></g>
<text x="22" y="880" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#1E2A3A">Not for Tea Party</text>
<g id="Not for Tea Party"><rect x="20" y="892" width="362" height="206" rx="20" fill="#FFFFFF" stroke="#ECE6DA" stroke-width="1"/><rect x="34" y="902" width="44" height="44" rx="12" fill="#F3EFE6"/><g transform="translate(40 908) scale(1.3333333333333333)"><path d="M4.2 6.4l1.6 1.2M19.8 6.4l-1.6 1.2M12 2.4v2" fill="none" stroke="#C99A3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.4 17.2v-4.6a5.6 5.6 0 0111.2 0v4.6z" fill="#E0694F" stroke="#9C3F2F" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M14.6 7.8a5.6 5.6 0 013 4.8v4.6h-2.4v-4.6c0-1.8-.2-3.4-.6-4.8z" fill="#9C3F2F" opacity="0.22"/><rect x="4.2" y="17" width="15.6" height="4.2" rx="1.6" fill="#4A5D78" stroke="#1E2A3A" stroke-width="1.4"/><path d="M8.8 11.2c.2-.9.7-1.7 1.4-2.2" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/></g><text x="92" y="920" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">Emergencies</text><text x="92" y="939" font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573">Call 911 instead.</text><rect x="92" y="958" width="290" height="1" fill="#ECE6DA"/><rect x="34" y="968" width="44" height="44" rx="12" fill="#F3EFE6"/><g transform="translate(40 974) scale(1.3333333333333333)"><rect x="5" y="8.4" width="14" height="13" rx="1.2" fill="#E0694F" stroke="#9C3F2F" stroke-width="1.4"/><path d="M15.6 8.4h2.2a1.2 1.2 0 011.2 1.2v10.6a1.2 1.2 0 01-1.2 1.2h-2.2z" fill="#9C3F2F" opacity="0.22"/><rect x="3.8" y="6" width="16.4" height="2.8" rx="1" fill="#4A5D78" stroke="#1E2A3A" stroke-width="1.4"/><rect x="7.4" y="10.8" width="3.4" height="2.8" rx="0.6" fill="#FFFFFF" stroke="#9C3F2F" stroke-width="1"/><rect x="13.2" y="10.8" width="3.4" height="2.8" rx="0.6" fill="#FFFFFF" stroke="#9C3F2F" stroke-width="1"/><rect x="7.4" y="14.8" width="3.4" height="2.8" rx="0.6" fill="#FFFFFF" stroke="#9C3F2F" stroke-width="1"/><rect x="13.2" y="14.6" width="3.4" height="6.8" rx="0.8" fill="#4A5D78" stroke="#1E2A3A" stroke-width="1.1"/><path d="M11.6 21.4h6.4" fill="none" stroke="#5E6672" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 9.8v2" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/></g><text x="92" y="986" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">Private property</text><text x="92" y="1005" font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573">Only public streets, parks and buildings.</text><rect x="92" y="1024" width="290" height="1" fill="#ECE6DA"/><rect x="34" y="1034" width="44" height="44" rx="12" fill="#F3EFE6"/><g transform="translate(40 1040) scale(1.3333333333333333)"><path d="M4.4 21.4c0-4.6 3.4-7.8 7.6-7.8s7.6 3.2 7.6 7.8z" fill="#3F8C8F" stroke="#1F4E52" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M15.4 14.4c2.5 1.2 4.2 3.8 4.2 7H16c0-2.8-.2-5-.6-7z" fill="#1F4E52" opacity="0.22"/><circle cx="12" cy="8.2" r="4.6" fill="#E2AE86" stroke="#A9714B" stroke-width="1.4"/><path d="M14 4.1a4.6 4.6 0 01-1.6 8.7c1.2-1.4 1.8-3 1.8-4.6 0-1.6-.1-2.9-.2-4.1z" fill="#A9714B" opacity="0.22"/><path d="M8.6 7c.3-.9.9-1.6 1.7-2" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/></g><text x="92" y="1052" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E2A3A">People or noise</text><text x="92" y="1071" font-family="DM Sans" font-size="13" font-weight="400" fill="#5B6573">We can’t act on complaints about people.</text></g>
<g id="Footnote"><text font-family="DM Sans" font-size="12.5" font-weight="400" fill="#8A919B"><tspan x="24" y="1132">If a report isn’t approved, we’ll tell you why.</tspan><tspan x="24" y="1149">Reports go to 311 anonymously: just the</tspan><tspan x="24" y="1166">photo, location and description.</tspan></text></g>
<rect x="134" y="1210" width="134" height="5" rx="2.5" fill="#1E2A3A"/></g></svg>